<h1>리눅스 PC에서도 GeForce NOW 사용 가능해지다</h1>

<p><strong>AI</strong> | 2026.02.05 | SO,NOW</p>

<p>NVIDIA는 Linux PC 사용자를 위한 GeForce NOW 공식 앱 베타판을 출시했다. 이로써 리눅스 환경에서도 클라우드 기반 RTX 성능을 이용할 수 있다. 동시에 새로운 게임 10개가 추가되어 게이머들에게 풍성한 경험을 제공한다.</p>
