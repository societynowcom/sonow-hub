<h1>안성기 별세 영향력 있는 배우의 영광</h1>

<p><strong>HEADLINES</strong> | 2026.01.05 | SO,NOW</p>

<p>6일 만에 끝낸 치료, 가족이 곁에서 지켰다 배우 안성기가 5일 오전 별세했습니다. 향년 74세였습니다. 그는 이날 오전 서울 용산구 순천향대병원 중환자실에서 치료받던 중 가족이 지켜보는 가운데 세상을 떠났습니다. 중환자실에서 의식불명 상태로 입원한 지 6일 만입니다.</p>
