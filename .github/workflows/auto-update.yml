name: Daily Update - SO,NOW Hub

on:
  schedule:
    # 매일 07:30 KST (22:30 UTC 전날), 08:30 KST (23:30 UTC 전날)
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  update-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate MD files from articles.json
        run: node scripts/generate-md.js

      - name: Check for changes
        id: check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "sonow-bot"
          git config user.email "societynowcom@gmail.com"
          git add -A
          git commit -m "auto: $(date +%Y-%m-%d) 기사 업데이트"
          git push
